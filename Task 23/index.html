<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">

</head>
<body>
    <div class="container">
        <h1 class="text-center p-5 m-4 fg-emphasis-info bg-1 fs-4xl fw-bolder">Random Quiz</h1>

        <div id="quizContainer" class="card p-5 m-5">
            <p class="fw-bold">Q21: What do the Olympic rings represent?</p>
            <label><input type="radio" name="option" value="A- The five oceans of the world"> A- The five oceans of the world</label>
            <label><input type="radio" name="option" value="B- The inhabited continents participating in the Games"> B- The inhabited continents participating in the Games</label>
            <label><input type="radio" name="option" value="C- Five medals awarded in every sport"> C- Five medals awarded in every sport</label>
            <label><input type="radio" name="option" value="D- Five centuries of ancient games"> D- Five centuries of ancient games</label>

            <button class="btn m-4">Next</button>
        </div>
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
